<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account settings</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; }
    form { max-width: 32rem; display: grid; gap: 16px; }
    label { display: grid; gap: 4px; }
    input { font: inherit; padding: 8px 12px; border: 1px solid #66666e; border-radius: 6px; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 6px; background: #1d4ed8; color: #fff; }
    button:focus-visible, input:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Account settings</h1>
    <form id="settings">
      <label>Display name <input name="display_name" autocomplete="nickname" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <p id="save-status" role="status"></p>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
