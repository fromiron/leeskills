<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Active workout · Workout log fixture</title>
  <link rel="stylesheet" href="../app.css">
  <script src="../shared.js"></script>
</head>
<body>
  <!-- Variant "after": the four defects of ../before/workout.html are fixed. -->
  <main>
    <h1>Active workout</h1>
    <div id="workout-view" class="stack">
      <ul class="sets" id="sets" aria-label="Logged sets"></ul>
      <p class="muted" id="empty">No sets yet.</p>
      <div class="row">
        <button type="button" class="primary" id="add-set">Add set</button>
        <button type="button" id="finish" disabled aria-describedby="finish-hint">Finish workout</button>
        <button type="button" id="more" aria-expanded="false" aria-controls="more-menu">More</button>
      </div>
      <p class="muted" id="finish-hint">Log at least one set to finish.</p>
      <div class="menu" id="more-menu" hidden>
        <button type="button" id="discard">Discard workout</button>
        <button type="button" id="close-more">Close</button>
      </div>
    </div>
    <div id="failed-view" class="stack" hidden>
      <p class="alert" role="alert" id="failed-message">Couldn't save your workout. Your sets are still on this device.</p>
      <div class="row">
        <button type="button" class="primary" id="retry">Try again</button>
        <button type="button" id="failed-discard">Discard workout</button>
      </div>
    </div>
  </main>

  <dialog id="set-form" aria-labelledby="set-form-title">
    <form method="dialog" novalidate>
      <h2 id="set-form-title" style="margin: 0; font-size: 1.125rem;">Add set</h2>
      <label>Exercise
        <select id="exercise"><option>Squat</option><option>Bench press</option><option>Deadlift</option></select>
      </label>
      <label>Weight (kg) <input id="weight" inputmode="decimal"></label>
      <label>Reps <input id="reps" inputmode="numeric" aria-describedby="reps-error"></label>
      <p class="error" id="reps-error" hidden>Enter the number of reps.</p>
      <div class="row">
        <button type="submit" class="primary" id="save-set">Save set</button>
        <button type="button" id="cancel-set">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="discard-confirm" aria-labelledby="discard-title" aria-describedby="discard-text">
    <div class="stack">
      <h2 id="discard-title" style="margin: 0; font-size: 1.125rem;">Discard this workout?</h2>
      <p id="discard-text">The sets you logged will be removed.</p>
      <div class="row">
        <button type="button" id="confirm-discard">Discard workout</button>
        <button type="button" class="primary" id="keep-workout">Keep workout</button>
      </div>
    </div>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    const paint = () => {
      renderSets($("sets"));
      const count = store.sets().length;
      $("empty").hidden = count > 0;
      $("finish").disabled = count === 0;
      $("finish-hint").hidden = count > 0;
    };
    const closeMore = () => { $("more-menu").hidden = true; $("more").setAttribute("aria-expanded", "false"); };
    const askDiscard = () => { closeMore(); $("discard-confirm").showModal(); };
    const save = () => {
      if (store.offline()) {
        $("workout-view").hidden = true;
        $("failed-view").hidden = false;
        return;
      }
      location.href = "summary.html";
    };

    $("add-set").addEventListener("click", () => {
      $("reps-error").hidden = true;
      $("weight").value = ""; $("reps").value = "";
      $("set-form").showModal();
    });
    $("cancel-set").addEventListener("click", () => $("set-form").close());
    $("set-form").querySelector("form").addEventListener("submit", (event) => {
      event.preventDefault();
      if (!$("reps").value.trim()) { $("reps-error").hidden = false; $("reps").focus(); return; }
      store.addSet({ exercise: $("exercise").value, weight: $("weight").value || "0", reps: $("reps").value });
      $("set-form").close();
      paint();
    });
    $("more").addEventListener("click", () => {
      const open = $("more-menu").hidden;
      $("more-menu").hidden = !open;
      $("more").setAttribute("aria-expanded", String(open));
    });
    $("close-more").addEventListener("click", closeMore);
    $("finish").addEventListener("click", save);
    $("retry").addEventListener("click", () => {
      if (store.offline()) $("failed-message").textContent = "Still offline. Try again when the connection is back.";
      save();
    });
    $("discard").addEventListener("click", askDiscard);
    $("failed-discard").addEventListener("click", askDiscard);
    $("keep-workout").addEventListener("click", () => {
      $("discard-confirm").close();
      $("failed-view").hidden = true;
      $("workout-view").hidden = false;
    });
    $("confirm-discard").addEventListener("click", () => { store.clear(); location.href = "today.html?discarded=1"; });
    paint();
  </script>
</body>
</html>
