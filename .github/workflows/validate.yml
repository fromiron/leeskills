name: Validate leeskills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        # ubuntu-latest no longer offers a Python 3.9 build. Keep the declared
        # minimum version covered on Linux with the last image that has one.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
